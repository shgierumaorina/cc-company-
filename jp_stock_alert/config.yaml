# 優良銘柄・安値圏×出来高急増 通知ツール 設定ファイル
# すべての閾値はここで調整する（コード側にマジックナンバーを埋め込まない）

universe:
  # 優良銘柄マスタ入りに必要な最低スコア（100点満点）
  score_pass_threshold: 90
  min_market_cap_oku_yen: 300      # 時価総額 300億円以上（流動性フィルタ）
  min_roe: 8.0                     # ROE 8%以上で加点、10%以上で満点
  roe_full_score: 10.0
  min_equity_ratio: 40.0           # 自己資本比率 40%以上で満点、30%以上で部分点
  equity_ratio_partial: 30.0
  max_payout_ratio: 50.0           # 配当性向 50%以下で満点、70%以下で部分点
  payout_ratio_partial: 70.0
  # irbank.netへのアクセス間隔・キャッシュ
  request_interval_sec: 2.0
  cache_ttl_hours: 24

signal:
  low_price:
    # 有効化するチェック（複数指定可）: ma_deviation / week52_low / drawdown
    checks: ["ma_deviation", "week52_low"]
    require: "any"                 # any=いずれか一つでも該当 / all=すべて該当(AND)
    ma_deviation_pct: -5.0         # 25日/75日線からの下方乖離率がこれ以下
    week52_low_upper_pct: 10.0     # 52週安値からの上昇率がこれ以内
    drawdown_lookback_days: 60
    drawdown_pct: -15.0            # 直近lookback_days日の高値からの下落率がこれ以下
  volume_surge:
    avg_period_days: 20            # 平均出来高の算出期間（当日を除く直近営業日数）
    multiplier: 2.0                # 平均出来高の何倍で急増と判定するか（弱シグナルの下限）
    strong_multiplier: 3.5         # 強シグナルの下限（この倍率以上で「強」候補）。2026-08-16バックテストで最良(64%勝率/平均+3.38%)のため3.0→3.5に引き上げ
    intraday_prorate: true         # ザラ場中は経過時間で按分補正する
    min_elapsed_minutes: 30        # 寄り付き直後は誤検知しやすいため按分判定自体をスキップする下限
  confirmation:
    min_day_range_pct: 3.0         # 当日値幅(高値-安値)/前日終値がこれ未満なら見せかけ出来高として除外
    bounce_lookback_days: 5        # 反発初動判定に使う直近安値の探索日数
  liquidity:
    min_turnover_oku_yen: 1.0      # 売買代金(現在値×当日出来高、億円換算)がこれ未満は除外

market_hours:
  sessions:
    - ["09:00", "11:30"]
    - ["12:30", "15:00"]

risk_management:
  account_balance_yen: 1000000      # 口座残高（円）。実際の残高に合わせて編集する
  risk_pct_min: 5.0                 # 1トレードの許容損失（残高比、下限）
  risk_pct_max: 8.0                 # 1トレードの許容損失（残高比、上限）
  stop_loss_pct_min: 9.0            # 損切り幅（下限、タイトな損切り）。2026-08-16バックテストで-10%が最良だったため7.0→9.0に引き上げ(レンジ表示は維持)
  stop_loss_pct_max: 10.0           # 損切り幅（上限、ワイドな損切り）。バックテストの最良値と一致のため据え置き
  share_unit: 100                   # 単元株数（この単位で切り捨てる）

notify:
  cooldown_hours: 24                # 同一銘柄・同日内の重複通知を防止

watch:
  poll_interval_minutes: 15         # watch.py（常駐ループ）のチェック間隔

obsidian:
  enabled: true
  vault_path: "C:/Users/shige/Documents/ObsidianVault"
  # 通知1件ごとに wiki/log.md へ追記（新しいエントリを先頭に、vaultのCLAUDE.md規約通り）
  # 優良銘柄マスタは rescreen.py 実行のたびに wiki/japan-stock.md へ日付セクションを追記（既存セクションは上書きしない）


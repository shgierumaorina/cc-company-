name: 英語リスニング 文字起こし準備

on:
  schedule:
    # 画面で「準備する」を押した回を30分ごとに拾う（対象がなければ数十秒で終了）
    - cron: '*/30 * * * *'
    # 毎朝 JST 3:07 に新着確認＋各番組の未準備の最新回を1本準備
    - cron: '7 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'queue = 準備待ちの回だけ / auto = 新着確認も行う'
        type: choice
        options: [queue, auto]
        default: queue

concurrency:
  group: english-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        working-directory: english-app
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENGLISH_APP_WORK: ${{ runner.temp }}/english
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: english-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 処理対象の確認
        id: check
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "TURSO_DATABASE_URL が未設定のためスキップ"
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MODE=--queue
          if [ "${{ github.event.schedule }}" = "7 18 * * *" ] || [ "${{ inputs.mode }}" = "auto" ]; then
            MODE=--auto
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          python -m app.prepare $MODE --check > check.txt
          cat check.txt
          grep '^has_work=' check.txt >> "$GITHUB_OUTPUT"

      - name: Whisperモデルのキャッシュ
        if: steps.check.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: 文字起こし部品のインストール
        if: steps.check.outputs.has_work == 'true'
        run: pip install -r requirements.txt

      - name: 文字起こし・問題作成
        if: steps.check.outputs.has_work == 'true'
        run: python -m app.prepare ${{ steps.check.outputs.mode }}
